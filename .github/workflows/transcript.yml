name: Extract YouTube Transcript

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fix 1: Install Deno so yt-dlp has a supported JS runtime
      - name: Install Deno (JS Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]"

      - name: Extract Transcript
        id: transcript_job
        env:
          URL: ${{ inputs.youtube_url }}
        run: |
          python -c "
          import os, json, glob, yt_dlp

          url = os.environ['URL']

          ydl_opts = {
              'skip_download': True,
              'writeautomaticsub': True,
              'writesubtitles': True,
              'subtitleslangs': ['en.*', 'en'],
              'subtitlesformat': 'json3',
              'outtmpl': 'raw_transcript',
              # Fix 2: Spoof client to bypass 'Sign in to confirm you are not a bot'
              'extractor_args': {
                  'youtube': {
                      'player_client': ['android', 'mweb']
                  }
              }
          }

          with yt_dlp.YoutubeDL(ydl_opts) as ydl:
              info = ydl.extract_info(url, download=True)
              title = info.get('title', 'YouTube Video')

          # Find generated subtitle JSON file
          sub_files = glob.glob('raw_transcript*.json3')
          if not sub_files:
              raise Exception('No transcript found for this video.')

          with open(sub_files[0], 'r', encoding='utf-8') as f:
              data = json.load(f)

          # Parse transcript lines
          lines = []
          for event in data.get('events', []):
              if 'segs' in event:
                  phrase = ''.join([seg['utf8'] for seg in event['segs'] if 'utf8' in seg])
                  if phrase.strip():
                      lines.append(phrase.strip())

          full_text = ' '.join(lines)

          # Save output to text file
          with open('transcript.txt', 'w', encoding='utf-8') as f:
              f.write(f'Title: {title}\nURL: {url}\n\n{full_text}')

          # Output summary directly into GitHub Actions run UI
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### Transcript: {title}\n\n{full_text[:1200]}...\n\n*(Full text available in Artifacts)*')
          "

      - name: Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript
          path: transcript.txt
