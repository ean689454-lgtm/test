name: Extract YouTube Transcript (Fast API)

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install youtube-transcript-api==0.6.1

      - name: Extract Transcript
        env:
          URL: ${{ inputs.youtube_url }}
        run: |
          python -c "
          import os, re
          from youtube_transcript_api import YouTubeTranscriptApi

          url = os.environ['URL']
          
          # Extract 11-char Video ID
          match = re.search(r'(?:v=|\/)([0-9A-Za-z_-]{11})', url)
          if not match:
              raise ValueError('Invalid YouTube URL')
          video_id = match.group(1)

          try:
              # Fetch transcript
              transcript_list = YouTubeTranscriptApi.get_transcript(video_id)
              full_text = ' '.join([item['text'] for item in transcript_list])

              with open('transcript.txt', 'w', encoding='utf-8') as f:
                  f.write(f'URL: {url}\n\n{full_text}')

              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'### Transcript for {video_id}\n\n{full_text[:1200]}...\n\n*(Full transcript saved to Artifacts)*')

          except Exception as e:
              print(f'Error fetching transcript: {e}')
              exit(1)
          "

      - name: Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript
          path: transcript.txt
